<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | TechSpace</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>

<header class="site-header">
    <nav class="navbar container">
        <a href="index.html" class="logo">Tech<span>Space</span></a>

        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">☰</button>

        <div class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="login.html" class="nav-button">Login</a>
        </div>
    </nav>
</header>

<main class="auth-section">
    <div class="auth-card">
        <div class="auth-heading">
            <span class="eyebrow">JOIN OUR COMMUNITY</span>
            <h1>Create Your Account</h1>
            <p>Register to publish articles and share your technology knowledge.</p>
        </div>

        <form id="registerForm">

            <div class="form-group">
                <label for="registerName">Full Name</label>
                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="registerEmail">Email Address</label>
                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email address"
                    required
                >
            </div>

            <div class="form-group">
                <label for="registerPassword">Password</label>
                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                Create Account
            </button>

            <p id="registerMessage" class="form-message"></p>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>
    </div>
</main>

<footer class="site-footer">
    <div class="container footer-content">
        <p>&copy; <span class="current-year"></span> TechSpace. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
